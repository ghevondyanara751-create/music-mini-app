    body {
        background-color: var(--tg-theme-bg-color, #121212);
        color: var(--tg-theme-text-color, #ffffff);
        display: flex;
        flex-direction: column;
        align-items: center;

        min-height: 100vh;

    }

    .player-card {

        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cover-art {
        width: 220px;
        height: 220px;
        border-radius: 15px;
        object-fit: cover;

        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .song-title {
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .artist-name {
        font-size: 0.9rem;
        color: #b3b3b3;
        margin-bottom: 20px;
    }

        width: 100%;
        background: #404040;
        border-radius: 5px;
        cursor: pointer;
        height: 6px;
        margin-bottom: 10px;
    }

    .progress-bar {
        background: #1db954;

        border-radius: 5px;
        transition: width 0.1s linear;
    }

\<body>

```
<div class="player-card">
    <img id="cover" class="cover-art" src="https://via.placeholder.com/220" alt="Album Cover">
    <div id="title" class="song-title">Երգի անունը</div>
    <div id="artist" class="artist-name">Կատարողը</div>

    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="time-stamps">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn" id="prev-btn">⏮</button>
        <button class="btn play-btn" id="play-btn">▶</button>
        <button class="btn" id="next-btn">⏭</button>
    </div>
</div>

<audio id="audio"></audio>

<script>
    // 1. Telegram Web App initialization
    const tg = window.Telegram.WebApp;
    tg.expand(); // Բացում է ամբողջ էկրանով

    // 2. Երգերի ցուցակը (Playlist) - Այստեղ տեղադրում ես քո երգերի հղումները
    const playlist = [
        {
            title: "Երգի Անուն 1",
            artist: "Կատարող 1",
            cover: "https://picsum.photos/220/220?random=1", // Նկարի հղում
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" // MP3 ուղիղ հղում
        },
        {
            title: "Երգի Անուն 2",
            artist: "Կատարող 2",
            cover: "https://picsum.photos/220/220?random=2",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
        }
    ];

    let currentSongIndex = 0;
    let isPlaying = false;

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const cover = document.getElementById('cover');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');

    // Երգի բեռնում
    function loadSong(song) {
        title.textContent = song.title;
        artist.textContent = song.artist;
        cover.src = song.cover;
        audio.src = song.url;
    }

    // Play / Pause logic
    function playSong() {
        isPlaying = true;
        playBtn.textContent = '⏸';
        audio.play();
    }

    function pauseSong() {
        isPlaying = false;
        playBtn.textContent = '▶';
        audio.pause();
    }

    playBtn.addEventListener('click', () => {
        if (isPlaying) {
            pauseSong();
        } else {
            playSong();
        }
    });

    // Next / Prev
    prevBtn.addEventListener('click', () => {
        currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
        loadSong(playlist[currentSongIndex]);
        playSong();
    });

    nextBtn.addEventListener('click', () => {
        currentSongIndex = (currentSongIndex + 1) % playlist.length;
        loadSong(playlist[currentSongIndex]);
        playSong();
    });

    // Progress bar update
    audio.addEventListener('timeupdate', (e) => {
        const { duration, currentTime } = e.srcElement;
        if (duration) {
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Time format
            const durationMinutes = Math.floor(duration / 60);
            let durationSeconds = Math.floor(duration % 60);
            if (durationSeconds < 10) durationSeconds = `0${durationSeconds}`;
            durationEl.textContent = `${durationMinutes}:${durationSeconds}`;

            const currentMinutes = Math.floor(currentTime / 60);
            let currentSeconds = Math.floor(currentTime % 60);
            if (currentSeconds < 10) currentSeconds = `0${currentSeconds}`;
            currentTimeEl.textContent = `${currentMinutes}:${currentSeconds}`;
        }
    });

    // Seek song
    progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        audio.currentTime = (clickX / width) * duration;
    });

    // Auto next when song ends
    audio.addEventListener('ended', () => {
        nextBtn.click();
    });

    // Initialize first song
    loadSong(playlist[currentSongIndex]);
</script>
